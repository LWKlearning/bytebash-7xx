<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03060d"><meta name="description" content="BYTEBASH 7XX — free, local-first sample production, arrangement, MIDI, effects, resampling and mixing."><title>BYTEBASH 7XX</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/jpeg" href="./assets/bytebash-logo.jpg"><link rel="apple-touch-icon" href="./assets/bytebash-logo.jpg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./ui.css"></head><body>
<div id="startup"><img src="./assets/startup.jpg" alt="BYTEBASH startup artwork"><div class="startup-title"><h1>BYTEBASH <span>7XX</span></h1><p>BYTE-BASH, BIT-CLASH</p><button id="start-button">CLICK TO BASH</button><p id="init-state" role="status">PROJECT SYSTEM</p><label><input id="startup-sound" type="checkbox" checked> Startup sound</label></div></div>
<div id="app" hidden><header id="transport"><div class="transport-group transport-project"><button class="wordmark" data-action="about"><img class="toolbar-logo" src="./assets/bytebash-logo.jpg" alt="" width="32" height="32">BYTEBASH <b>7XX</b></button><input id="project-name" aria-label="Project name" value="Untitled session"><span id="save-state">Local</span><button data-action="undo" title="Undo · Ctrl Z">↶</button><button data-action="redo" title="Redo · Ctrl Shift Z">↷</button><button id="transport-more" aria-expanded="false" aria-label="More transport controls">More ▾</button></div><div class="transport-group transport-playback"><button data-action="rewind" title="Rewind">Ⅰ◀</button><button data-action="play" id="play-button" title="Play / pause · Space">▶</button><button data-action="stop" title="Stop">■</button><button data-action="record" id="record-button" title="Record audio / MIDI into selected track">●</button><button data-action="loop" id="loop-button" title="Loop">↻</button><button data-action="metronome" id="metro-button" title="Metronome">♩</button><output id="position">1:1:000</output><label class="small">BPM<input id="bpm" type="number" min="20" max="400" value="150"></label></div><div class="transport-extra"><button data-action="quick-record" id="quick-record-button">Mic → sample</button><button data-action="capture-performance">Capture last</button><button data-action="punch" id="punch-button" title="Punch recording range">Punch</button><select id="signature" aria-label="Time signature"><option>4/4</option><option>3/4</option><option>6/8</option><option>7/8</option><option>5/4</option></select><label class="small countin"><input id="countin" type="checkbox"> Count-in</label><div class="spacer"></div><canvas id="master-mini" width="76" height="25" aria-label="Master output meter"></canvas><button data-action="save" title="Save · Ctrl S">Save</button><button data-action="export" class="primary">Export</button><button data-action="settings" title="Settings">⚙</button></div></header>
<div id="workbench"><aside id="browser"><div class="panel-heading"><b>SOUNDS</b><button data-action="import" title="Import audio">+</button><button data-action="toggle-browser" title="Collapse sample browser">‹</button></div><input id="sample-search" placeholder="Search sounds, tags, artist…" aria-label="Search samples"><div class="browser-tabs"><button data-scope="all" class="active">Pack</button><button data-scope="files">Files</button><button data-scope="favorites">★</button><button data-scope="recent">Recent</button></div><select id="category" aria-label="Sample category"><option value="">All categories</option></select><div class="preview-options"><label><input id="auto-preview" type="checkbox" checked> Auto</label><label><input id="preview-loop" type="checkbox"> Loop</label><select id="preview-mode" aria-label="Audition mode"><option value="original">Original</option><option value="sync">BPM sync</option><option value="key">Match root</option><option value="context">Replace in context</option></select></div><button data-action="rename-sound" class="text-button">Name sound</button><button data-action="use-candidate" class="text-button">Use candidate in selection</button><div id="sample-list" tabindex="0" role="listbox" aria-label="Sample library"></div><div id="sample-info">RHSP3 2023 · loading</div><button class="text-button" data-action="cache-pack">Cache pack for offline use</button></aside><div class="resize-handle" id="browser-resize" role="separator" aria-label="Resize sample browser"></div>
<main id="main"><nav class="arrangement-toolbar"><button data-action="file-menu">File</button><button data-action="edit-menu">Edit</button><button data-action="create-menu">Create</button><button data-action="tools-menu">Tools</button><button data-action="view-menu">View</button><button data-action="help-menu">Help</button><select id="tool" aria-label="Arrangement tool"><option value="select">Select</option><option value="pan">Hand / navigate</option><option value="split">Slice</option><option value="erase">Erase</option><option value="draw">Draw MIDI</option></select><label>Snap<select id="snap"><option value="0">Off</option><option value="4">Bar</option><option value="1">¼</option><option value=".5">⅛</option><option value=".25" selected>1/16</option><option value=".125">1/32</option><option value=".0625">1/64</option><option value=".333333333">⅛ T</option><option value=".166666667">1/16 T</option></select></label><div class="spacer"></div><button data-action="zoom-out" title="Zoom out">−</button><input id="zoom" type="range" min="8" max="160" value="36" aria-label="Timeline zoom"><button data-action="zoom-in" title="Zoom in">+</button><button data-action="fit" title="Fit song">Fit</button></nav>
<div id="arrangement"><div id="track-headers"></div><div id="timeline-scroll" tabindex="0" aria-label="Arrangement timeline"><canvas id="timeline"></canvas></div></div>
<div class="editor-resize" id="editor-resize" role="separator" aria-label="Resize lower editor"></div><section id="editor"><nav class="editor-tabs"><button data-editor="audio" class="active">Audio</button><button data-editor="piano">Piano roll</button><button data-editor="automation">Automation</button><button data-editor="mixer">Mixer</button><button data-editor="kick">Kick Lab</button><button data-editor="analysis">Analysis</button><div class="spacer"></div><button data-action="expand-editor" title="Expand lower editor">↕</button><button data-action="toggle-editor" title="Collapse lower editor">⌄</button></nav><div id="editor-tools"></div><div id="editor-body"></div></section></main>
<div class="resize-handle" id="inspector-resize" role="separator" aria-label="Resize inspector"></div><aside id="inspector"><div class="panel-heading"><b>INSPECTOR</b><button data-action="toggle-inspector" title="Collapse inspector">›</button></div><div id="inspector-content"></div></aside></div>
<nav id="phone-nav" aria-label="Production workspace"><button data-action="toggle-browser">Sounds</button><button data-action="phone-arrange">Arrange</button><button data-action="phone-piano">Notes</button><button data-action="phone-effects">FX</button><button data-action="phone-mixer">Mix</button></nav><footer><span id="status" role="status">Ready</span><div class="spacer"></div><span id="engine-info">Audio asleep</span><button class="text-button" data-action="command">Commands · Ctrl K</button></footer></div>
<input id="audio-import" type="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a" multiple hidden><input id="project-import" type="file" accept=".bytebash,.zip,.json" hidden><input id="midi-import" type="file" accept=".mid,.midi" hidden><dialog id="dialog"></dialog><div id="context-menu" hidden></div><div id="toast" hidden role="status"></div><script type="module" src="./app.js"></script></body></html>
